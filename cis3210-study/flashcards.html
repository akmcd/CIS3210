<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flashcards — CIS*3210 Midterm Study</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css?v=20261022b">
</head>
<body data-page="flashcards">
  <header id="site-header"></header>
  <main>
    <div class="page-head">
      <h1>Flashcards</h1>
      <p>Terms, header fields, socket calls and protocol rules. Flip a card, then mark whether you knew it.</p>
    </div>

    <div class="fc-wrap">
      <div class="chip-row" id="topics" role="group" aria-label="Topic"></div>
      <div class="btn-row" style="margin-bottom:18px">
        <label class="inline"><input type="checkbox" id="learning-only"> Only cards I'm still learning</label>
        <button class="btn quiet" type="button" id="shuffle">Shuffle</button>
        <button class="btn quiet" type="button" id="reset">Reset progress</button>
      </div>

      <div class="fc-meta"><span id="position"></span><span id="known-count"></span></div>
      <div class="fc-progress" aria-hidden="true"><span id="known-bar"></span></div>

      <div id="stage">
        <div class="card-stage">
          <button class="flashcard" id="card" type="button" aria-live="polite">
            <div class="face front"><span class="topic-tag" id="front-topic"></span><div class="text" id="front-text"></div><span class="hint">Click or press Space to flip</span></div>
            <div class="face back"><span class="topic-tag" id="back-topic"></span><div class="text" id="back-text"></div></div>
          </button>
        </div>
        <div class="btn-row">
          <button class="btn quiet" type="button" id="prev">Previous</button>
          <button class="btn secondary" type="button" id="again">Still learning</button>
          <button class="btn" type="button" id="got">Got it</button>
          <button class="btn quiet" type="button" id="next">Next</button>
        </div>
        <p class="muted" style="margin-top:14px;font-size:0.9rem">Keys: <span class="kbd">Space</span> flip, <span class="kbd">←</span> <span class="kbd">→</span> move, <span class="kbd">G</span> got it, <span class="kbd">L</span> still learning.</p>
      </div>
      <div id="empty" hidden>
        <p class="lead"><strong>You know every card in this set.</strong></p>
        <p>Turn off "Only cards I'm still learning" to review them all, or pick another topic.</p>
      </div>
    </div>
  </main>

  <script src="assets/common.js?v=20261022b"></script>
  <script src="data/flashcards.js?v=20261022b"></script>
  <script>
  (function () {
    const S = window.Study;
    const ALL = window.FLASHCARDS.map((c, i) => Object.assign({ key: c.topic + ':' + c.front }, c));
    let known = new Set(S.store.get('cardsKnown', []));
    let topic = 'all', learningOnly = false, deck = [], pos = 0;

    const el = id => document.getElementById(id);
    const card = el('card');

    function saveKnown() { S.store.set('cardsKnown', Array.from(known)); }

    function buildTopics() {
      const host = el('topics');
      const opts = [['all', 'All topics']].concat(S.TOPIC_ORDER.filter(t => ALL.some(c => c.topic === t)).map(t => [t, S.TOPICS[t]]));
      host.innerHTML = opts.map(o => '<button class="chip" type="button" data-topic="' + o[0] + '" aria-pressed="' + (o[0] === topic) + '">' + S.esc(o[1]) + '</button>').join('');
      host.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
        topic = b.dataset.topic;
        host.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
        buildDeck(false);
      }));
    }

    function buildDeck(shuffled) {
      let cards = ALL.filter(c => topic === 'all' || c.topic === topic);
      if (learningOnly) cards = cards.filter(c => !known.has(c.key));
      deck = shuffled ? S.shuffle(cards) : cards;
      pos = 0;
      render();
    }

    function render() {
      const inTopic = ALL.filter(c => topic === 'all' || c.topic === topic);
      const k = inTopic.filter(c => known.has(c.key)).length;
      el('known-count').textContent = k + ' of ' + inTopic.length + ' known';
      el('known-bar').style.width = (inTopic.length ? (100 * k / inTopic.length) : 0) + '%';
      if (!deck.length) {
        el('stage').hidden = true; el('empty').hidden = false; el('position').textContent = '';
        return;
      }
      el('stage').hidden = false; el('empty').hidden = true;
      const c = deck[pos];
      card.classList.remove('flipped');
      el('front-text').innerHTML = S.md(c.front);
      el('back-text').innerHTML = S.md(c.back);
      const t = S.TOPICS[c.topic] + (known.has(c.key) ? ', marked known' : '');
      el('front-topic').textContent = t; el('back-topic').textContent = t;
      el('position').textContent = 'Card ' + (pos + 1) + ' of ' + deck.length;
      el('prev').disabled = pos === 0;
    }

    function flip() { card.classList.toggle('flipped'); }
    function move(d) {
      if (!deck.length) return;
      pos = Math.min(Math.max(pos + d, 0), deck.length - 1);
      render();
    }
    function mark(isKnown) {
      if (!deck.length) return;
      const c = deck[pos];
      if (isKnown) known.add(c.key); else known.delete(c.key);
      saveKnown();
      if (learningOnly && isKnown) {
        deck.splice(pos, 1);
        if (pos >= deck.length) pos = Math.max(0, deck.length - 1);
        render();
      } else if (pos < deck.length - 1) { move(1); } else { render(); }
    }

    card.addEventListener('click', flip);
    el('prev').addEventListener('click', () => move(-1));
    el('next').addEventListener('click', () => move(1));
    el('got').addEventListener('click', () => mark(true));
    el('again').addEventListener('click', () => mark(false));
    el('shuffle').addEventListener('click', () => buildDeck(true));
    el('learning-only').addEventListener('change', e => { learningOnly = e.target.checked; buildDeck(false); });
    el('reset').addEventListener('click', () => {
      if (!window.confirm('Mark every card as still learning?')) return;
      known = new Set(); saveKnown(); buildDeck(false);
    });
    document.addEventListener('keydown', e => {
      if (e.target.closest && e.target.closest('input, select, textarea')) return;
      if (e.key === ' ' || e.key === 'Enter') { if (e.target === card || e.target === document.body) { e.preventDefault(); flip(); } }
      else if (e.key === 'ArrowRight') move(1);
      else if (e.key === 'ArrowLeft') move(-1);
      else if (e.key === 'g' || e.key === 'G') mark(true);
      else if (e.key === 'l' || e.key === 'L') mark(false);
    });

    buildTopics();
    buildDeck(false);
  })();
  </script>
</body>
</html>
